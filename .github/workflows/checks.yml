name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r desktop/requirements.txt
      - run: python -m unittest discover -s desktop -p "test_*.py"
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [display, headless]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: python -m platformio run --project-dir firmware -e ${{ matrix.environment }}
